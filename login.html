<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro - GRAVAFILT S.A.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl">
        <div class="text-center mb-8">
            <i class="fa-solid fa-mountain text-amber-500 text-4xl mb-3"></i>
            <h1 class="text-xl font-bold text-white tracking-wider">GRAVAFILT S.A.</h1>
            <p class="text-xs text-slate-400 mt-1">Sistema de Control y Gestión de Acopios</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2.5 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-amber-500 transition" placeholder="Ingrese su usuario">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2.5 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-amber-500 transition" placeholder="••••••••">
                </div>
            </div>

            <div id="errorMsg" class="hidden bg-rose-500/20 border border-rose-500 text-rose-300 text-xs p-3 rounded-lg text-center">
                Credenciales incorrectas. Verifique usuario o contraseña.
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg">
                Iniciar Sesión Segura
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-700 pt-4 text-xs text-slate-500">
            Seguridad de Doble Capa - Acceso Autorizado
        </div>
    </div>

    <script>
        const USERS = {
            "admin": { pass: "gravafilt2026", role: "admin", name: "Administrador General" },
            "usuario": { pass: "gravafilt", role: "operator", name: "Operador de Carga" }
        };

        function handleLogin(event) {
            event.preventDefault();
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('errorMsg');

            const user = USERS[userVal];
            if (user && user.pass === passVal) {
                sessionStorage.setItem("gravafilt_user", JSON.stringify(user));
                window.location.href = "index.html";
            } else {
                errorBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
